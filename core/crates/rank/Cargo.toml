[package]
name = "rank"
version = "0.1.0"
description = "Fuzzy ranking of a folder's paths for the file pickers: a listing held by id, searched on each keystroke."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dispatch = { path = "../dispatch" }
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# the parity fixture's scores are compared to the bit, and the default parser can be one bit off
serde_json = { version = "1", features = ["float_roundtrip"] }
