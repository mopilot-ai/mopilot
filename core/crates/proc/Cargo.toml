[package]
name = "proc"
version = "0.1.0"
description = "The process table and tree, and the system's memory pressure, read with native calls instead of ps and sysctl."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dispatch = { path = "../dispatch" }
framing = { path = "../framing" }
inventory = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
